name: Malen

options:
  bundleIdPrefix: dev.rubeen
  developmentLanguage: de
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  PaintEngine:
    path: Packages/PaintEngine

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: H95J852PKP

targets:
  Malen:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: PaintEngine
        product: PaintEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.malen
        PRODUCT_NAME: Malen
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: Malen
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic

  MalenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MalenTests
    dependencies:
      - target: Malen
      - package: PaintEngine
        product: PaintEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.malen.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"

  MalenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MalenUITests
    dependencies:
      - target: Malen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.malen.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"

schemes:
  Malen:
    build:
      targets:
        Malen: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MalenTests
        - MalenUITests
